[project]
name = "agent-hive"
version = "0.1.0"
description = "Hive: a shared workspace where coding agents coordinate, co-edit files, message each other, and run task graphs, exposed over MCP, a CLI, harness hooks, and a Python API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "okezue" }]
keywords = ["agents", "multi-agent", "mcp", "coordination", "llm", "orchestration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Software Development",
]
dependencies = ["mcp>=2.1", "httpx>=0.27", "jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
hive = "hive.cli:main"

[project.urls]
Homepage = "https://github.com/okezue/hive"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hive"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["*.py"]
python_functions = ["test*"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "B"]
ignore = ["B905"]
